# StealColor Photo · Publica la web (portada, privacidad y la app en /app/) en Cloudflare Pages
# Se ejecuta sola cuando cambia la web o la app (o a mano: Actions → Publica la web → Run workflow).
# Necesita el secreto CLOUDFLARE_API_TOKEN (permiso Cloudflare Pages · Edit). El dominio va en la variable DOMINIO.
name: Publica la web

on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'scripts/build-site.mjs', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: web
  cancel-in-progress: true

env:
  CF_ACCOUNT_ID: c0c5d225523184f05949796fed095220
  PROYECTO: stealcolorphoto
  DOMINIO: ${{ vars.DOMINIO || 'stealcolorphoto.com' }}

jobs:
  publica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Monta la web (dist-web/)
        run: |
          npm install --no-save --no-audit --no-fund @fontsource-variable/geist@5 @fontsource-variable/geist-mono@5
          node scripts/build-site.mjs

      - name: Comprueba la llave de Cloudflare y crea el proyecto si no existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."; exit 1
          fi
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$T"; echo "CF_TOKEN=$T" >> "$GITHUB_ENV"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          code=$(curl -sS -o p.json -w '%{http_code}' -H "Authorization: Bearer $T" "$api/$PROYECTO")
          if [ "$code" = "404" ] || grep -q '"code":8000007' p.json; then
            echo "Creando el proyecto $PROYECTO…"
            code=$(curl -sS -o p.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$PROYECTO\",\"production_branch\":\"main\"}" "$api")
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare responde $code: $(head -c 400 p.json). Revisa que el token tenga el permiso Cloudflare Pages · Edit."; exit 1
          fi
          rm -f p.json

      - name: Publica
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=${{ env.PROYECTO }} --branch=main --commit-dirty=true

      - name: Conecta el dominio propio
        if: ${{ env.DOMINIO != '' }}
        run: |
          for d in "$DOMINIO" "www.$DOMINIO"; do
            curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$d\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROYECTO/domains" | head -c 300; echo
          done

      - name: Comprueba la web
        run: |
          url="https://$PROYECTO.pages.dev"
          for i in $(seq 1 12); do
            a=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
            b=$(curl -s -o /dev/null -w '%{http_code}' "$url/app/")
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then echo "✓ $url funciona (portada y app)"; exit 0; fi
            sleep 10
          done
          echo "::warning::$url aún no responde (portada $a, app $b). La primera vez puede tardar unos minutos."

      - name: Comprueba el dominio
        if: ${{ env.DOMINIO != '' }}
        continue-on-error: true
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMINIO/" || true)
            [ "$code" = "200" ] && { echo "✓ https://$DOMINIO funciona"; exit 0; }
            sleep 15
          done
          echo "::warning::https://$DOMINIO aún no responde ($code). Si acabas de comprar el dominio, el certificado puede tardar hasta 15 min; vuelve a lanzar este flujo después."
